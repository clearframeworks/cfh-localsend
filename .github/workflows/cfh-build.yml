name: CFH Share Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip:
    needs: build
    runs-on: windows-latest


    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add DLL files
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/x64/runner/Release/localsend_msix_helper.msix
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1
          Remove-Item build/windows/x64/runner/Release/localsend_app.exe.manifest

      # The SignPath artifact configuration expects "LocalSend-*-windows-*-64.zip" containing "localsend_app.exe"
      - name: Include upstream and AWS-LC notices
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\LICENSE" "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release\LICENSE"
          Copy-Item "$env:GITHUB_WORKSPACE\CFH-FORK.md" "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release\CFH-FORK.md"
          Copy-Item "$env:GITHUB_WORKSPACE\THIRD_PARTY" "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release\THIRD_PARTY" -Recurse
      - name: Zip compiled files
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip"

      - name: Upload unsigned zip
        id: unsigned-zip
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-zip-unsigned
          path: app/LocalSend-${{ needs.build.outputs.version }}-windows-x86-64.zip
          if-no-files-found: error


      - name: Build CFH installer
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppId=CFHShare
          AppName=CFH Share
          AppVersion=1.18.2
          AppPublisher=Coders for Humanity
          DefaultDirName={localappdata}\Programs\CFH Share
          DefaultGroupName=CFH Share
          PrivilegesRequired=lowest
          OutputDir=$env:RUNNER_TEMP\cfh-installer
          OutputBaseFilename=CFH-Share-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\CFH Share"; Filename: "{app}\localsend_app.exe"
          "@
          $iss | Set-Content "$env:RUNNER_TEMP\cfh.iss" -Encoding utf8
          iscc "$env:RUNNER_TEMP\cfh.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Smoke test installer
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\cfh-installer\CFH-Share-Setup.exe"
          $dir = "$env:RUNNER_TEMP\cfh-installed"
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$dir\localsend_app.exe")) { throw "Installation failed" }
          foreach ($notice in @('LICENSE','CFH-FORK.md','THIRD_PARTY\README.md','THIRD_PARTY\aws-lc-rs\LICENSE','THIRD_PARTY\aws-lc-sys\LICENSE','THIRD_PARTY\aws-lc\LICENSE','THIRD_PARTY\aws-lc\NOTICE','THIRD_PARTY\aws-lc\third_party\fiat\LICENSE','THIRD_PARTY\aws-lc\third_party\s2n-bignum\LICENSE')) {
            if (!(Test-Path (Join-Path $dir $notice))) { throw "Installed notice missing: $notice" }
          }
          $app = Start-Process -FilePath "$dir\localsend_app.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Application exited during startup" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          if (-not $uninstall) { throw "Uninstaller missing" }
          $p = Start-Process -FilePath $uninstall.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed" }
      - name: Upload CFH installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-share-windows-installer-unsigned
          path: ${{ runner.temp }}\cfh-installer\CFH-Share-Setup.exe
          if-no-files-found: error