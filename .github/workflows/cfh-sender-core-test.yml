name: CFH Share sender core integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d2e582d0d67c5beb5e115de0a2e24926b0aed724
          persist-credentials: false
      - name: Test upstream web send implementation
        run: cargo test -p localsend --features full --test v2_web_send