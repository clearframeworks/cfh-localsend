name: CFH Share dependency audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 61a36b00ab0f561edb51b7b89a2d31a3d3190c10
          persist-credentials: false
      - name: Install OSV Scanner 2.7.0
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Audit dependencies
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive .