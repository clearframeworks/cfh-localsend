name: Inspect isolated sender screen
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve diagnostic screenshot on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42393151015 --repo clearframeworks/cfh-localsend --name sender-window-diagnostic --dir "$RUNNER_TEMP/screen"
      - name: OCR screen on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          tesseract "$RUNNER_TEMP/screen/sender-window.png" stdout tsv